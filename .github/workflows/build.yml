name: Build Offline Attendance APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download & Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          export PATH=$PWD/gradle-8.4/bin:$PATH
          gradle -v

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          export PATH=$PWD/gradle-8.4/bin:$PATH
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: OSA-Offline-Attendance-APK
          path: app/build/outputs/apk/debug/*.apk
